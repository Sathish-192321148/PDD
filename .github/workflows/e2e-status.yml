name: E2E Status

run-name: Run Full Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  System:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    - name: Run E2E Verification Report Generator
      run: |
        python .github/workflows/scripts/generate_e2e_report.py

    - name: Upload E2E Reports
      uses: actions/upload-artifact@v4
      with:
        name: e2e-reports
        path: e2e-reports/
        retention-days: 5

    - name: Generate Run Summary
      run: |
        echo "Downloaded Excel sheet contains complete logs and verification details. 🚀" >> $GITHUB_STEP_SUMMARY
